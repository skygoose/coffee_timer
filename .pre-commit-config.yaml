repos:
  # Ruff (all-in-one linter, formatter, and import sorter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6  # Check for latest version
    hooks:
      - id: ruff
        args: [--fix]  # Auto-fix what it can

  # Codespell (typo checker)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6  # Check for latest version
    hooks:
      - id: codespell
        args: ["--ignore-words-list=brew,coffee"]  # Whitelist coffee terms
